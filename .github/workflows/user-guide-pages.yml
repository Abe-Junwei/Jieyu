name: user-guide

# VitePress user guide → GitHub Pages.
# Pages is currently off (has_pages=false). Enable it in
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# configure-pages is omitted: it fails while Pages is not configured,
# which would block the build that proves VitePress compiles.

on:
  pull_request:
    paths:
      - 'user-guide/**'
      - '.github/workflows/user-guide-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'user-guide/**'
      - '.github/workflows/user-guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-guide-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: user-guide/package-lock.json
      - name: Install user-guide dependencies
        working-directory: user-guide
        run: npm ci
      - name: Build VitePress
        working-directory: user-guide
        run: npm run docs:build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: user-guide/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
