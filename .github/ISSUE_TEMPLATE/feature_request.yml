name: 功能建议 | Feature request
description: 建议一项改进或新能力 | Suggest an improvement or new capability
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先看[已有功能请求](https://github.com/Abe-Junwei/Jieyu/issues?q=is%3Aissue+label%3Aenhancement)，以及 Discussions 里的 Ideas。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 | What problem does this solve?
      description: 哪一种田野或整理流程今天做起来困难。
      placeholder: 我需要在导出 ELAN 之前先……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 | Proposed solution
      description: 你希望它如何工作。草图或链接都可以。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 | Alternatives considered
      description: 现有的绕过办法，或其他方案。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关区域 | Area
      options:
        - 转写 / transcription
        - 标注 / annotation
        - 词典 / lexicon
        - 语料库 / corpus
        - 导出 / export
        - 协作 / collaboration
        - 其他 / other
    validations:
      required: true
