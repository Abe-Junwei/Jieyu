<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>转写行</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--text-sm); }
    main { max-width: 720px; margin: 32px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--border-soft); }
    .line:first-child { border-top: 0; }
    .sel { background: var(--surface-warm); box-shadow: inset 2px 0 0 var(--fg); }
    .bad { background: var(--danger-bg); color: var(--danger-text); align-items: center; }
    .bad .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--danger); }
    .ipa { font-family: var(--font-ipa); }
    .time { font-family: var(--font-mono); font-size: var(--text-xs); }
    .tag { height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-pill); background: var(--surface-warm); color: var(--fg-2); font-size: var(--text-xs); }
    .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    button { height: 32px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface); color: var(--fg); border: 1px solid var(--border-control); font: 600 var(--text-sm)/var(--leading-sm) var(--font-body); }
  </style>
</head>
<body>
<main>
  <div class="line sel"><span><span class="time">00:00:04.120</span> <span class="ipa">ŋa˥ tʂʰɐ˧ lo˩</span></span><span>讲述人A</span></div>
  <div class="line"><span><span class="time">00:00:12.400</span> 正在输入</span><span>未保存</span></div>
  <div class="line bad"><span><span class="dot"></span><span class="time">00:00:21.000</span> 保存失败，草稿还在</span><button>重试</button></div>
  <div class="line"><span><span class="time">00:00:31.200</span> <span class="ipa">mi˧ ʑa˥</span></span><span class="tag"><i></i>待复核</span></div>
</main>
</body>
</html>
