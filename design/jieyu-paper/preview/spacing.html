<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>间距与形状</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="preview.css" />
  <style>
    .scale { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; align-items: center; }
    .bar { height: 12px; background: var(--fg); }
    .bar.page { background: var(--border-strong); }
    .shapes { display: flex; gap: 24px; align-items: end; }
    .shape { width: 96px; height: 64px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font-size: var(--text-xs); color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div>
    <h1>间距与形状</h1>
    <p class="note">4px 步进，优先 8px 节奏。20、10、6px 不再使用。</p>
  </div>
  <section>
    <h2>组件内</h2>
    <div class="scale">
      <span class="mono">4 · space-1</span><span class="bar" style="width:4px"></span>
      <span class="mono">8 · space-2</span><span class="bar" style="width:8px"></span>
      <span class="mono">12 · space-3</span><span class="bar" style="width:12px"></span>
      <span class="mono">16 · space-4</span><span class="bar" style="width:16px"></span>
      <span class="mono">24 · space-6</span><span class="bar" style="width:24px"></span>
      <span class="mono">32 · space-8</span><span class="bar" style="width:32px"></span>
    </div>
  </section>
  <section>
    <h2>页面级留白</h2>
    <div class="scale">
      <span class="mono">40 · space-10</span><span class="bar page" style="width:40px"></span>
      <span class="mono">48 · space-12</span><span class="bar page" style="width:48px"></span>
      <span class="mono">64 · space-16</span><span class="bar page" style="width:64px"></span>
    </div>
  </section>
  <section>
    <h2>尺寸</h2>
    <p class="meta">控件 32px，紧凑 28px。列表行 36–44px。时间轴轨高 54px。左轨 52px。图标 20px，伴随文字 16px，图标与文字间距 8px，命中至少 24×24。</p>
  </section>
  <section>
    <h2>圆角</h2>
    <div class="shapes">
      <div class="shape" style="border-radius:0">工作面 0</div>
      <div class="shape" style="border-radius:4px">控件 4</div>
      <div class="shape" style="border-radius:8px">菜单 / 对话框 8</div>
    </div>
  </section>
</main>
</body>
</html>
