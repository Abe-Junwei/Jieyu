<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>壳层</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="preview.css" />
  <script src="icons.js"></script>
  <style>
    .shell { display: grid; grid-template-columns: var(--rail-width) 248px 1fr; height: 420px; background: var(--bg); border: 1px solid var(--border); }
    .rail { background: var(--surface); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
    .rail b { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--fg-2); }
    .rail b.end { margin-top: auto; }
    .rail b.on { background: var(--brand-tint); color: var(--secondary); box-shadow: inset 2px 0 0 var(--brand); }
    .ctx { background: var(--context); border-right: 1px solid var(--border); display: grid; align-content: start; }
    .ctx h2 { margin: 0; padding: 12px 16px 8px; font: 600 var(--text-xs)/var(--leading-xs) var(--font-body); color: var(--muted); }
    .item { height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: var(--text-base); }
    .item.sel { background: var(--selection); box-shadow: inset 2px 0 0 var(--fg); }
    .item .mono { margin-left: auto; color: var(--muted); }
    .main { display: grid; grid-template-rows: 44px 1fr; background: var(--surface); }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-soft); }
    .toolbar .sep { width: 1px; height: 20px; background: var(--border-soft); }
    .toolbar .save { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: var(--text-sm); color: var(--fg-2); }
    .canvas { display: grid; place-items: center; color: var(--muted); font-size: var(--text-sm); }
    .states { display: grid; grid-template-columns: repeat(4, max-content); gap: 8px 24px; font-size: var(--text-sm); }
    .states div { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<main>
  <div>
    <h1>壳层</h1>
    <p class="note">52px 左轨 + 上下文栏 + 主区。无右栏检查器，无底部当前片段页，不画窗口标题栏。左轨只放 20px 图标，悬停和读屏给完整名称；设置沉底。</p>
  </div>

  <div class="shell">
    <nav class="rail" aria-label="左轨">
      <b aria-label="工程夹" title="工程夹"><svg class="i lg"><use href="#library"/></svg></b><b class="on" aria-current="page" aria-label="转写" title="转写"><svg class="i lg"><use href="#audio-lines"/></svg></b><b aria-label="标注" title="标注"><svg class="i lg"><use href="#pencil"/></svg></b><b aria-label="词典" title="词典"><svg class="i lg"><use href="#book-open"/></svg></b><b aria-label="语料库" title="语料库"><svg class="i lg"><use href="#notebook-pen"/></svg></b><b aria-label="分析复核" title="分析复核"><svg class="i lg"><use href="#brain"/></svg></b><b aria-label="语言资产" title="语言资产"><svg class="i lg"><use href="#languages"/></svg></b><b class="end" aria-label="设置" title="设置"><svg class="i lg"><use href="#settings"/></svg></b>
    </nav>
    <aside class="ctx">
      <h2>稿件</h2>
      <div class="item sel">卡朗语 · 田野录音 03<span class="mono">12:48</span></div>
      <div class="item">卡朗语 · 田野录音 04<span class="mono">08:02</span></div>
      <h2>层</h2>
      <div class="item">转写 · 卡朗语<span class="mono">48</span></div>
      <div class="item">翻译 · 汉语<span class="mono">31</span></div>
    </aside>
    <section class="main">
      <div class="toolbar">
        <button class="btn icon" aria-label="播放（空格）" title="播放（空格）"><svg class="i"><use href="#play"/></svg></button>
        <span class="mono">00:01:12.480</span>
        <span class="sep"></span>
        <button class="btn icon ghost" aria-label="缩小" title="缩小"><svg class="i"><use href="#zoom-out"/></svg></button><button class="btn icon ghost" aria-label="放大" title="放大"><svg class="i"><use href="#zoom-in"/></svg></button>
        <span class="sep"></span>
        <button class="btn icon ghost" aria-label="撤销 ⌘Z" title="撤销 ⌘Z"><svg class="i"><use href="#undo-2"/></svg></button><button class="btn icon ghost" aria-label="重做 ⇧⌘Z" title="重做 ⇧⌘Z"><svg class="i"><use href="#redo-2"/></svg></button>
        <span class="save"><span class="dot ok"></span>已保存</span>
      </div>
      <div class="canvas">波形与多轨时间轴（见「时间轴」）</div>
    </section>
  </div>

  <section>
    <h2>保存状态</h2>
    <div class="states">
      <div><span class="dot idle"></span>未保存</div>
      <div><span class="dot idle"></span>保存中...</div>
      <div><span class="dot err"></span>保存失败 <button class="btn sm">重试</button></div>
      <div><span class="dot ok"></span>已保存</div>
      <div><span class="dot warn"></span>已保存，界面还没刷新。</div>
    </div>
    <p class="meta">未知或未提供状态不显示「已保存」。结果未知时不给重试或放弃。</p>
  </section>

  <section>
    <h2>窄窗</h2>
    <p class="meta">1280 及以下先把上下文栏收成重开条，保留左轨、主时间轴和当前焦点。</p>
  </section>
</main>
</body>
</html>
